<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />

        <link rel="stylesheet" href="/assets/styles/user/styles.css" />
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #f5f7fb;
                color: #1f2937;
                font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            }

            .retired-card {
                width: min(640px, calc(100% - 32px));
                padding: 32px;
                border-radius: 16px;
                background: #fff;
                box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
            }

            .retired-card h1 {
                margin: 0 0 12px;
                font-size: 28px;
            }

            .retired-card p {
                margin: 0 0 12px;
                line-height: 1.7;
                color: #4b5563;
            }

            .retired-card a {
                color: #2563eb;
                text-decoration: none;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <script src="/router/common/auth-guard.js" defer></script>
        <script>
            window.addEventListener('DOMContentLoaded', function () {
                if (window.AuthGuard) {
                    AuthGuard.protectPage('user');
                }
            });
        </script>

        <main class="retired-card">
            <h1>旧 AI 页面已停用</h1>
