<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="在健康守护中连接 Fitbit 设备，同步步数、睡眠与健康数据。" />
        <meta name="robots" content="noindex,nofollow" />
        <link rel="canonical" href="https://www.example.invalid/views/user/dashboard/fitbit-connection.html" />
        <title>Fitbit 连接 - 健康守护</title>
        <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
        <link rel="shortcut icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
        <link rel="stylesheet" href="/assets/styles/user/styles.css" />
    </head>
    <body>
        <script src="/utils/config/app-config.js"></script>
        <script src="/utils/config/fitbit-config.js"></script>
        <script src="/api/common/fitbit-api.js"></script>
        <script src="/router/common/auth-guard.js"></script>
        <script>
            window.addEventListener('DOMContentLoaded', function () {
                if (window.AuthGuard) {
                    AuthGuard.protectPage('user');
                }

                initUserAvatar();
            });

            function getLatestUserAvatar() {
                try {
                    const loginInfo = JSON.parse(sessionStorage.getItem('loginInfo') || '{}');
                    const currentUser = loginInfo.user || {};

                    if (currentUser.avatar) {
                        return currentUser.avatar;
                    }

                    const users = JSON.parse(localStorage.getItem('users') || '[]');
                    const accounts = JSON.parse(localStorage.getItem('accounts') || '{}');
                    const accountUsers = Array.isArray(accounts.user) ? accounts.user : [];
                    const matcher = user =>
                        user && (user.id === currentUser.id || user.username === currentUser.username);

                    const matchedUser = users.find(matcher) || accountUsers.find(matcher);
                    return matchedUser && matchedUser.avatar ? matchedUser.avatar : '';
                } catch (error) {
                    console.error('读取用户头像失败:', error);
                    return '';
                }
            }

            function applyUserAvatar(avatar) {
                const avatarElement = document.querySelector('.avatar');
                if (!avatarElement || !avatar) {
                    return;
                }

                avatarElement.style.backgroundImage = `url(${avatar})`;
            }

            function initUserAvatar() {
                applyUserAvatar(getLatestUserAvatar());

                window.addEventListener('storage', function (event) {
                    if (event.key === 'avatarUpdate' && event.newValue) {
                        try {
                            const payload = JSON.parse(event.newValue);
                            applyUserAvatar(payload.avatar || '');
                        } catch (error) {
                            console.error('同步头像更新失败:', error);
                        }
                    }
                });

                if (typeof BroadcastChannel !== 'undefined') {
                    const channel = new BroadcastChannel('avatar_sync');
                    channel.addEventListener('message', function (event) {
                        if (event.data && event.data.type === 'AVATAR_UPDATED') {
                            applyUserAvatar(event.data.avatar || '');
                        }
                    });
                }
            }

            window.logout = function() {
                if (confirm('确定要退出登录吗？')) {
                    if (window.AuthGuard) {
                        AuthGuard.logout();
                    }
                }
            };
        </script>
        <nav id="navbar" class="navbar navbar-with-back">
            <div class="navbar-back-container">
                <button class="back-button" onclick="window.location.href = 'device-connection.html'" aria-label="返回设备连接">
                    <span class="back-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </span>
                    返回
                </button>
                <span class="page-title">Fitbit手环连接</span>
                <div class="avatar-container">
                    <button id="avatar-button" class="avatar-button">
                        <div class="avatar"></div>
                    </button>
                    <div id="avatar-menu" class="avatar-menu">
                        <button class="menu-item" onclick="window.location.href = 'settings.html'">设置</button>
                        <button class="menu-item" onclick="window.location.href = 'device-connection.html'">
                            设备连接
                        </button>
                        <button class="menu-item" onclick="logout()">退出登录</button>
                    </div>
                </div>
            </div>
        </nav>

        <main id="content" class="content">
            <div class="status-card">
                <div class="page-header">
                    <h2>Fitbit手环连接</h2>
                </div>

                <div id="loading-indicator" class="loading-indicator" style="display: none">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>

                <div class="search-section">
                    <div class="search-box">
                        <input type="text" id="search-input" class="search-input" placeholder="搜索Fitbit设备..." />
                        <button class="search-button" id="search-button">搜索</button>
                    </div>
                    <button class="refresh-button" id="refresh-button">
                        🔄 刷新设备列表
                    </button>
                </div>

                <div class="device-section">
                    <h3>搜索到的设备</h3>
                    <div class="device-list" id="available-devices">
                        <div class="empty-state" id="available-empty">
                            <p>点击"刷新设备列表"开始搜索</p>
                        </div>
                    </div>
                </div>

                <div class="device-section">
                    <h3>已连接设备</h3>
                    <div class="device-list" id="connected-devices">
                        <div class="empty-state" id="connected-empty">
                            <p>暂无已连接设备</p>
                        </div>
                    </div>
                </div>

                <div class="connection-status" id="connection-status">
                    <div class="status-indicator" id="status-indicator"></div>
                    <span id="status-text">等待连接...</span>
                </div>
            </div>
        </main>

        <script>
            (function () {
                'use strict';

                const DEVICE_STORAGE_PREFIX = 'fitbitConnectedDevices';
                const fitbitApi = typeof FitbitAPI === 'function' ? new FitbitAPI() : null;
                let availableDevices = [];
                let connectedDevices = [];

                const mockFitbitDevices = [
                    {
                        id: 1,
                        device_code: 'fitbit_charge5',
                        device_name: 'Fitbit Charge 5',
                        device_nickname: '我的运动手环',
                        device_type: '运动手环',
                        description: '健康监测手环，支持心率、睡眠监测',
                        battery_level: 85,
                        signal_strength: '强',
                        icon_url: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=fitbit%20charge%205%20fitness%20tracker%20device&image_size=square',
                    },
                    {
                        id: 2,
                        device_code: 'fitbit_versa4',
                        device_name: 'Fitbit Versa 4',
                        device_nickname: '智能手表',
                        device_type: '智能手表',
                        description: '智能手表，支持GPS和心率监测',
                        battery_level: 62,
                        signal_strength: '强',
                        icon_url: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=fitbit%20versa%204%20smartwatch&image_size=square',
                    },
                    {
                        id: 3,
                        device_code: 'fitbit_inspire3',
                        device_name: 'Fitbit Inspire 3',
                        device_nickname: '轻便手环',
                        device_type: '运动手环',
                        description: '轻便型健康追踪手环',
                        battery_level: 95,
                        signal_strength: '强',
                        icon_url: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=fitbit%20inspire%203%20fitness%20tracker&image_size=square',
                    },
                ];

                function getCurrentUserId() {
                    try {
                        const loginInfo = JSON.parse(sessionStorage.getItem('loginInfo') || localStorage.getItem('loginInfo') || '{}');
                        const user = loginInfo.user || {};
                        return String(user.id || user.userId || user.username || loginInfo.username || 'guest');
                    } catch (error) {
                        console.error('读取当前用户信息失败:', error);
                        return 'guest';
                    }
                }

                function getConnectedDevicesStorageKey() {
                    return `${DEVICE_STORAGE_PREFIX}_${getCurrentUserId()}`;
                }

                function loadConnectedDevices() {
                    try {
                        const saved = localStorage.getItem(getConnectedDevicesStorageKey());
                        connectedDevices = saved ? JSON.parse(saved) : [];
                    } catch (error) {
                        console.error('读取已连接设备失败:', error);
                        connectedDevices = [];
                    }
                }

                function saveConnectedDevices() {
                    try {
                        localStorage.setItem(getConnectedDevicesStorageKey(), JSON.stringify(connectedDevices));
                    } catch (error) {
                        console.error('保存已连接设备失败:', error);
                    }
                }

                function showLoading() {
                    document.getElementById('loading-indicator').style.display = 'flex';
                }

                function hideLoading() {
                    document.getElementById('loading-indicator').style.display = 'none';
                }

                function updateConnectionStatus(status, text) {
                    const indicator = document.getElementById('status-indicator');
                    const statusText = document.getElementById('status-text');
                    
                    indicator.className = 'status-indicator ' + status;
                    statusText.textContent = text;
                }

                function searchDevices() {
                    showLoading();
                    updateConnectionStatus('searching', '正在搜索设备...');
                    
                    setTimeout(() => {
                        availableDevices = [...mockFitbitDevices];
                        hideLoading();
                        updateConnectionStatus('idle', '搜索完成');
                        renderAvailableDevices();
                    }, 2000);
                }

                function filterDevices(searchTerm) {
                    if (!searchTerm) {
                        return availableDevices;
                    }
                    return availableDevices.filter(device => 
                        device.device_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        device.device_nickname.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                function renderAvailableDevices() {
                    const container = document.getElementById('available-devices');
                    const searchInput = document.getElementById('search-input');
                    const filteredDevices = filterDevices(searchInput.value);

                    const unconnectedDevices = filteredDevices.filter(d => 
                        !connectedDevices.some(c => c.device_code === d.device_code)
                    );

                    if (unconnectedDevices.length === 0) {
                        container.innerHTML = '<div class="empty-state"><p>暂无可连接设备</p></div>';
                        return;
                    }

                    container.innerHTML = unconnectedDevices.map(device => `
                        <div class="device-item" data-device-code="${device.device_code}" data-device-id="${device.id}">
                            <div class="device-info">
                                <div class="device-icon" style="background-image: url('${device.icon_url || ''}')"></div>
                                <div class="device-details">
                                    <div class="device-name">${device.device_nickname || device.device_name}</div>
                                    <div class="device-type">${device.device_type}</div>
                                    <div class="device-description">${device.description || ''}</div>
                                    <div class="device-meta">
                                        <span>电量: ${device.battery_level}%</span>
                                        <span>信号: ${device.signal_strength}</span>
                                    </div>
                                    <div class="device-status disconnected">未连接</div>
                                </div>
                            </div>
                            <div class="device-actions">
                                <button class="feature-button" data-action="connect" data-device-code="${device.device_code}">连接</button>
                            </div>
                        </div>
                    `).join('');
                }

                function renderConnectedDevices() {
                    const container = document.getElementById('connected-devices');

                    if (connectedDevices.length === 0) {
                        container.innerHTML = '<div class="empty-state" id="connected-empty"><p>暂无已连接设备</p></div>';
                        return;
                    }

                    container.innerHTML = connectedDevices.map(device => `
                        <div class="device-item" data-device-code="${device.device_code}" data-device-id="${device.id}">
                            <div class="device-info">
                                <div class="device-icon" style="background-image: url('${device.icon_url || ''}')"></div>
                                <div class="device-details">
                                    <div class="device-name">${device.device_nickname || device.device_name}</div>
                                    <div class="device-type">${device.device_type}</div>
                                    <div class="device-description">${device.description || ''}</div>
                                    <div class="device-meta">
                                        <span>电量: ${device.battery_level}%</span>
                                        <span>信号: ${device.signal_strength}</span>
                                        <span>连接时间: ${device.connected_at ? new Date(device.connected_at).toLocaleString() : '-'}</span>
                                    </div>
                                    <div class="device-status connected">已连接</div>
                                </div>
                            </div>
                            <div class="device-actions">
                                <button class="feature-button secondary" data-action="sync" data-device-code="${device.device_code}">同步数据</button>
                                <button class="feature-button danger" data-action="disconnect" data-device-code="${device.device_code}">断开</button>
                            </div>
                        </div>
                    `).join('');
                }

                async function connectDevice(deviceCode, button) {
                    if (!deviceCode || !button) return;

                    if (fitbitApi && /^fitbit_/i.test(deviceCode)) {
                        updateConnectionStatus('connecting', '正在跳转 Fitbit 授权...');
                        fitbitApi.startAuth();
                        return;
                    }

                    button.textContent = '连接中...';
                    button.disabled = true;
                    updateConnectionStatus('connecting', '正在连接设备...');

                    setTimeout(() => {
                        const device = availableDevices.find(d => d.device_code === deviceCode);
                        if (device) {
                            connectedDevices.push({ ...device, connected_at: new Date().toISOString() });
                            saveConnectedDevices();
                            showNotification('设备连接成功', 'success');
                            updateConnectionStatus('connected', '设备已连接');
                        } else {
                            showNotification('连接失败，请重试', 'error');
                            updateConnectionStatus('error', '连接失败');
                        }
                        renderAvailableDevices();
                        renderConnectedDevices();
                    }, 2000);
                }

                async function disconnectDevice(deviceCode, button) {
                    if (!deviceCode || !button) return;

                    if (!confirm('确定要断开该设备的连接吗？')) return;

                    button.textContent = '断开中...';
                    button.disabled = true;
                    updateConnectionStatus('disconnecting', '正在断开连接...');

                    setTimeout(() => {
                        connectedDevices = connectedDevices.filter(d => d.device_code !== deviceCode);
                        saveConnectedDevices();
                        showNotification('设备已断开连接', 'info');
                        updateConnectionStatus('idle', '等待连接...');
                        renderAvailableDevices();
                        renderConnectedDevices();
                    }, 1500);
                }

                async function syncDeviceData(deviceCode, button) {
                    if (!deviceCode || !button) return;

                    button.textContent = '同步中...';
                    button.disabled = true;
                    updateConnectionStatus('syncing', '正在同步数据...');

                    setTimeout(() => {
                        showNotification('数据同步成功', 'success');
                        updateConnectionStatus('connected', '设备已连接');
                        button.textContent = '同步数据';
                        button.disabled = false;
                    }, 2500);
                }

                function loadUserAvatar() {
                    try {
                        const loginInfo = JSON.parse(sessionStorage.getItem('loginInfo'));
                        if (loginInfo && loginInfo.user && loginInfo.user.avatar) {
                            const avatarDiv = document.querySelector('.avatar');
                            if (avatarDiv) {
                                avatarDiv.style.backgroundImage = `url(${loginInfo.user.avatar})`;
                            }
                        }
                    } catch (error) {
                        console.error('加载用户头像失败:', error);
                    }
                }

                function setupAvatarSync() {
                    if (typeof BroadcastChannel !== 'undefined') {
                        const channel = new BroadcastChannel('avatar_sync');
                        channel.onmessage = function (event) {
                            if (event.data && event.data.type === 'AVATAR_UPDATED') {
                                updateAvatarDisplay(event.data.avatar);
                            }
                        };
                    }

                    window.addEventListener('storage', function (e) {
                        if (e.key === 'avatarUpdate' && e.newValue) {
                            try {
                                const data = JSON.parse(e.newValue);
                                if (data && data.avatar) {
                                    updateAvatarDisplay(data.avatar);
                                }
                            } catch (error) {
                                console.error('解析头像更新数据失败:', error);
                            }
                        }
                    });
                }

                function updateAvatarDisplay(avatarData) {
                    const avatarDiv = document.querySelector('.avatar');
                    if (avatarDiv) {
                        avatarDiv.style.backgroundImage = 'url(' + avatarData + ')';
                    }
                    try {
                        const loginInfo = JSON.parse(sessionStorage.getItem('loginInfo'));
                        if (loginInfo && loginInfo.user) {
                            loginInfo.user.avatar = avatarData;
                            sessionStorage.setItem('loginInfo', JSON.stringify(loginInfo));
                        }
                    } catch (error) {
                        console.error('更新 sessionStorage 头像失败:', error);
                    }
                }

                function setupEventListeners() {
                    const avatarButton = document.getElementById('avatar-button');
                    const avatarMenu = document.getElementById('avatar-menu');

                    if (avatarButton && avatarMenu) {
                        avatarButton.addEventListener('click', function (e) {
                            e.stopPropagation();
                            avatarMenu.classList.toggle('show');
                        });

                        document.addEventListener('click', function () {
                            avatarMenu.classList.remove('show');
                        });

                        avatarMenu.addEventListener('click', function (e) {
                            e.stopPropagation();
                        });
                    }

                    const content = document.getElementById('content');
                    if (content) {
                        content.addEventListener('click', handleContentClick);
                    }

                    document.getElementById('refresh-button').addEventListener('click', searchDevices);
                    document.getElementById('search-button').addEventListener('click', renderAvailableDevices);
                    document.getElementById('search-input').addEventListener('input', renderAvailableDevices);
                }

                function handleContentClick(e) {
                    const target = e.target;

                    if (target.matches('[data-action="connect"]')) {
                        e.preventDefault();
                        const deviceCode = target.getAttribute('data-device-code');
                        connectDevice(deviceCode, target);
                    }

                    if (target.matches('[data-action="disconnect"]')) {
                        e.preventDefault();
                        const deviceCode = target.getAttribute('data-device-code');
                        disconnectDevice(deviceCode, target);
                    }

                    if (target.matches('[data-action="sync"]')) {
                        e.preventDefault();
                        const deviceCode = target.getAttribute('data-device-code');
                        syncDeviceData(deviceCode, target);
                    }
                }

                function showNotification(message, type) {
                    type = type || 'info';

                    const notification = document.createElement('div');
                    notification.className = 'notification notification-' + type;
                    notification.textContent = message;
                    notification.style.cssText =
                        'position: fixed;top: 20px;right: 20px;padding: 12px 24px;border-radius: 4px;color: white;font-size: 14px;z-index: 10000;animation: slideIn 0.3s ease-out;max-width: 300px;word-wrap: break-word;';

                    switch (type) {
                        case 'success':
                            notification.style.backgroundColor = '#34C759';
                            break;
                        case 'error':
                            notification.style.backgroundColor = '#FF3B30';
                            break;
                        case 'info':
                        default:
                            notification.style.backgroundColor = '#007AFF';
                            break;
                    }

                    const style = document.createElement('style');
                    style.textContent =
                        '@keyframes slideIn {from {transform: translateX(100%);opacity: 0;}to {transform: translateX(0);opacity: 1;}}';
                    if (!document.head.querySelector('style[data-notification]')) {
                        style.setAttribute('data-notification', 'true');
                        document.head.appendChild(style);
                    }

                    document.body.appendChild(notification);

                    setTimeout(function () {
                        notification.style.animation = 'slideIn 0.3s ease-out reverse';
                        setTimeout(function () {
                            if (notification.parentNode) {
                                notification.parentNode.removeChild(notification);
                            }
                        }, 300);
                    }, 3000);
                }

                if (fitbitApi) {
                    fitbitApi.onAuthSuccess = function () {
                        showNotification('Fitbit 授权成功', 'success');
                        updateConnectionStatus('connected', 'Fitbit 授权成功，已建立连接');
                    };

                    fitbitApi.onAuthError = function (message) {
                        showNotification(message || 'Fitbit 授权失败', 'error');
                        updateConnectionStatus('error', message || 'Fitbit 授权失败');
                    };
                }

                function init() {
                    loadConnectedDevices();
                    loadUserAvatar();
                    setupAvatarSync();
                    setupEventListeners();
                    renderAvailableDevices();
                    renderConnectedDevices();
                    console.log('Fitbit connection page initialized');
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', init);
                } else {
                    init();
                }
            })();
        </script>

        <style>
            .page-header {
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 24px;
            }

            .back-button {
                background-color: #f0f0f0;
                color: #333;
                border: none;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                transition: background-color 0.2s;
            }

            .back-button:hover {
                background-color: #e0e0e0;
            }

            .search-section {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                margin-bottom: 24px;
                align-items: center;
            }

            .search-box {
                flex: 1;
                min-width: 280px;
                display: flex;
                gap: 8px;
            }

            .search-input {
                flex: 1;
                padding: 10px 16px;
                border: 1px solid #ddd;
                border-radius: 6px;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
            }

            .search-input:focus {
                border-color: #007aff;
            }

            .search-button, .refresh-button {
                background-color: #007aff;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: background-color 0.2s;
            }

            .search-button:hover, .refresh-button:hover {
                background-color: #0056b3;
            }

            .connection-status {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px;
                background-color: #f8f9fa;
                border-radius: 8px;
                margin-top: 24px;
            }

            .status-indicator {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                animation: pulse 2s infinite;
            }

            .status-indicator.idle {
                background-color: #888;
            }

            .status-indicator.searching {
                background-color: #007aff;
                animation: blink 0.5s infinite;
            }

            .status-indicator.connecting,
            .status-indicator.disconnecting,
            .status-indicator.syncing {
                background-color: #ff9500;
                animation: blink 0.5s infinite;
            }

            .status-indicator.connected {
                background-color: #34c759;
            }

            .status-indicator.error {
                background-color: #ff3b30;
            }

            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.5; }
            }

            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.3; }
            }

            .device-icon {
                width: 48px;
                height: 48px;
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center;
                margin-right: 16px;
                border-radius: 8px;
            }

            .device-details {
                flex: 1;
            }

            .device-type {
                font-size: 12px;
                color: #666;
                margin-top: 2px;
            }

            .device-description {
                font-size: 12px;
                color: #888;
                margin-top: 2px;
            }

            .device-meta {
                display: flex;
                gap: 16px;
                font-size: 12px;
                color: #666;
                margin-top: 4px;
                flex-wrap: wrap;
            }

            .feature-button.secondary {
                background-color: #f0f0f0;
                color: #333;
            }

            .feature-button.danger {
                background-color: #ff3b30;
                color: white;
            }

            .empty-state {
                padding: 40px;
                text-align: center;
                color: #888;
            }

            .loading-indicator {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #f3f3f3;
                border-top: 4px solid #007aff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </body>
</html>
