<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="重置健康守护系统密码，继续访问 www.example.invalid 的健康管理服务。" />
        <meta name="robots" content="noindex,follow" />
        <link rel="canonical" href="https://www.example.invalid/views/auth/forgot-password.html" />
        <title>重置密码 - 健康守护系统</title>
        <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
        <link rel="shortcut icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Poppins', 'Noto Sans SC', sans-serif;
                position: relative;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow-x: hidden;
                color: #2d3748;
            }

            /* 动态渐变背景 */
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
                background-size: 400% 400%;
                animation: gradientShift 15s ease infinite;
                z-index: -2;
            }

            /* 浮动粒子效果 */
            body::after {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image:
                    radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.4) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(118, 75, 162, 0.4) 0%, transparent 50%),
                    radial-gradient(circle at 50% 50%, rgba(240, 147, 251, 0.3) 0%, transparent 50%),
                    radial-gradient(circle at 70% 20%, rgba(79, 172, 254, 0.35) 0%, transparent 50%);
                animation: particleFloat 20s ease-in-out infinite;
                z-index: -1;
            }

            @keyframes gradientShift {
                0% {
                    background-position: 0% 50%;
                }
                50% {
                    background-position: 100% 50%;
                }
                100% {
                    background-position: 0% 50%;
                }
            }

            @keyframes particleFloat {
                0%,
                100% {
                    transform: translate(0, 0) scale(1);
                    opacity: 0.5;
                }
                25% {
                    transform: translate(50px, -30px) scale(1.2);
                    opacity: 0.7;
                }
                50% {
                    transform: translate(-40px, 40px) scale(0.95);
                    opacity: 0.6;
                }
                75% {
                    transform: translate(30px, 20px) scale(1.1);
                    opacity: 0.65;
                }
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            /* 容器 */
            .reset-container {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                border-radius: 24px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                width: 90%;
                max-width: 450px;
                padding: 50px 40px;
                animation: slideIn 0.6s ease-out;
                position: relative;
                overflow: hidden;
            }

            .reset-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            }

            /* 标题区域 */
            .reset-header {
                text-align: center;
                margin-bottom: 40px;
            }

            .reset-header .logo {
                width: 80px;
                height: 80px;
                margin: 0 auto 20px;
                background: linear-gradient(135deg, #667eea, #764ba2);
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            }

            .reset-header .logo i {
                font-size: 2.5rem;
                color: white;
            }

            .reset-header h1 {
                font-size: 2rem;
                font-weight: 700;
                color: #2d3748;
                margin-bottom: 8px;
                letter-spacing: -0.5px;
            }

            .reset-header p {
                color: #718096;
                font-size: 0.95rem;
                line-height: 1.6;
            }

            /* 表单样式 */
            .reset-form {
                margin-bottom: 25px;
            }

            .form-group {
                margin-bottom: 25px;
                position: relative;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #4a5568;
                font-weight: 500;
                font-size: 0.9rem;
            }

            .input-wrapper {
                position: relative;
            }

            .input-wrapper i {
                position: absolute;
                left: 18px;
                top: 50%;
                transform: translateY(-50%);
                color: #a0aec0;
                font-size: 1.1rem;
            }

            .form-group input {
                width: 100%;
                padding: 14px 18px 14px 50px;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                font-size: 1rem;
                transition: all 0.3s;
                background: white;
                font-family: inherit;
            }

            .form-group input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            }

            .form-group input::placeholder {
                color: #cbd5e0;
            }

            /* 按钮 */
            .btn-reset {
                width: 100%;
                padding: 16px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 12px;
                font-size: 1.05rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
                font-family: inherit;
            }

            .btn-reset:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            }

            .btn-reset:active {
                transform: translateY(0);
            }

            .btn-reset:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            /* 返回登录链接 */
            .back-link {
                text-align: center;
                margin-top: 30px;
                color: #718096;
                font-size: 0.95rem;
            }

            .back-link a {
                color: #667eea;
                text-decoration: none;
                font-weight: 600;
                transition: color 0.3s;
            }

            .back-link a:hover {
                color: #764ba2;
            }

            /* 消息提示 */
            .message {
                padding: 12px 16px;
                border-radius: 10px;
                margin-bottom: 20px;
                font-size: 0.9rem;
                display: none;
                animation: fadeIn 0.3s;
            }

            .message.error {
                background: #fed7d7;
                color: #c53030;
                border: 1px solid #fc8181;
            }

            .message.success {
                background: #c6f6d5;
                color: #2f855a;
                border: 1px solid #9ae6b4;
            }

            .message.info {
                background: #bee3f8;
                color: #2b6cb0;
                border: 1px solid #63b3ed;
            }

            .message i {
                margin-right: 8px;
            }

            /* 重置密码弹出提示 */
            .reset-alert {
                position: fixed;
                top: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(-20px);
                min-width: min(420px, calc(100vw - 32px));
                max-width: min(420px, calc(100vw - 32px));
                padding: 16px 18px;
                border-radius: 16px;
                color: #fff;
                box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
                display: flex;
                align-items: flex-start;
                gap: 12px;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
                z-index: 3000;
            }

            .reset-alert.show {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: translateX(-50%) translateY(0);
            }

            .reset-alert.error {
                background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            }

            .reset-alert.success {
                background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            }

            .reset-alert.info {
                background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            }

            .reset-alert-icon {
                width: 38px;
                height: 38px;
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.16);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
                flex-shrink: 0;
            }

            .reset-alert-content {
                flex: 1;
                min-width: 0;
            }

            .reset-alert-title {
                font-size: 0.98rem;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .reset-alert-text {
                font-size: 0.9rem;
                line-height: 1.5;
                opacity: 0.95;
                word-break: break-word;
            }

            .reset-alert-close {
                border: none;
                background: transparent;
                color: inherit;
                cursor: pointer;
                padding: 4px;
                font-size: 1rem;
                opacity: 0.85;
                transition: opacity 0.2s ease, transform 0.2s ease;
            }

            .reset-alert-close:hover {
                opacity: 1;
                transform: scale(1.08);
            }

            .reset-alert-close:focus {
                outline: none;
            }

            /* 响应式设计 */
            @media (max-width: 480px) {
                .reset-container {
                    padding: 40px 30px;
                    width: 95%;
                }

                .reset-header h1 {
                    font-size: 1.6rem;
                }
            }

            /* 加载动画 */
            .loading {
                display: inline-block;
                width: 16px;
                height: 16px;
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-top-color: white;
                border-radius: 50%;
                animation: spin 0.6s linear infinite;
                margin-left: 8px;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* 步骤指示器 */
            .steps {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-bottom: 30px;
            }

            .step {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .step-number {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #e2e8f0;
                color: #a0aec0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 600;
                transition: all 0.3s;
            }

            .step.active .step-number {
                background: linear-gradient(135deg, #667eea, #764ba2);
                color: white;
            }

            .step.completed .step-number {
                background: #48bb78;
                color: white;
            }

            .step-label {
                font-size: 0.8rem;
                color: #a0aec0;
            }

            .step.active .step-label,
            .step.completed .step-label {
                color: #4a5568;
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <script src="../../utils/config/api-config.js"></script>
        <script src="../../api/common/api-service.js"></script>
        <div id="resetAlert" class="reset-alert" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="reset-alert-icon">
                <i class="fas fa-info-circle"></i>
            </div>
            <div class="reset-alert-content">
                <div class="reset-alert-title">提示</div>
                <div class="reset-alert-text"></div>
            </div>
            <button type="button" class="reset-alert-close" id="resetAlertClose" aria-label="关闭提示">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="reset-container">
            <div class="reset-header">
                <div class="logo">
                    <img src="/assets/icons/favicon.svg" alt="Logo" style="width: 60px; height: 60px;">
                </div>
                <h1>重置密码</h1>
                <p>请输入您的用户名和注册邮箱，我们将帮助您重置密码</p>
            </div>

            <div id="message" class="message"></div>

            <!-- 步骤指示器 -->
            <div class="steps">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <span class="step-label">验证身份</span>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <span class="step-label">设置新密码</span>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <span class="step-label">完成</span>
                </div>
            </div>

            <!-- 步骤1: 验证身份 -->
            <form class="reset-form" id="step1Form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="请输入您的用户名" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">邮箱</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="请输入您的注册邮箱" required />
                    </div>
                </div>

                <button type="submit" class="btn-reset" id="step1Btn">
                    <span>下一步</span>
                </button>
            </form>

            <!-- 步骤2: 设置新密码 -->
            <form class="reset-form" id="step2Form" style="display: none">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="请输入新密码"
                            required
                            minlength="6"
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="请再次输入新密码"
                            required
                            minlength="6"
                        />
                    </div>
                </div>

                <button type="submit" class="btn-reset" id="step2Btn">
                    <span>重置密码</span>
                </button>
            </form>

            <!-- 步骤3: 完成 -->
            <div id="step3Content" style="display: none; text-align: center">
                <div style="font-size: 4rem; color: #48bb78; margin-bottom: 20px">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="color: #2d3748; margin-bottom: 10px">密码重置成功！</h2>
                <p style="color: #718096; margin-bottom: 30px">您的密码已成功重置，现在可以使用新密码登录了。</p>
                <button type="button" class="btn-reset" onclick="window.location.href = 'login.html'">
                    <span>返回登录</span>
                </button>
            </div>

            <div class="back-link">
                <a href="login.html"><i class="fas fa-arrow-left"></i> 返回登录页面</a>
            </div>
        </div>

        <script>
            let currentStep = 1;
            let verifiedUsername = '';
            let resetAlertTimer = null;

            function hideMessage() {
                const alertEl = document.getElementById('resetAlert');
                if (!alertEl) {
                    return;
                }

                alertEl.classList.remove('show');

                if (resetAlertTimer) {
                    clearTimeout(resetAlertTimer);
                    resetAlertTimer = null;
                }
            }

            // 显示消息
            function showMessage(message, type = 'info') {
                const alertEl = document.getElementById('resetAlert');
                if (!alertEl) {
                    return;
                }

                const iconMap = {
                    error: 'exclamation-circle',
                    success: 'check-circle',
                    info: 'info-circle',
                };
                const titleMap = {
                    error: '操作失败',
                    success: '操作成功',
                    info: '提示',
                };
                const iconEl = alertEl.querySelector('.reset-alert-icon i');
                const titleEl = alertEl.querySelector('.reset-alert-title');
                const textEl = alertEl.querySelector('.reset-alert-text');

                alertEl.className = `reset-alert ${type}`;
                iconEl.className = `fas fa-${iconMap[type] || 'info-circle'}`;
                titleEl.textContent = titleMap[type] || '提示';
                textEl.textContent = message;

                if (resetAlertTimer) {
                    clearTimeout(resetAlertTimer);
                }

                alertEl.classList.add('show');

                resetAlertTimer = setTimeout(() => {
                    hideMessage();
                }, type === 'error' ? 5000 : 3000);
            }

            document.getElementById('resetAlertClose').addEventListener('click', hideMessage);

            // 更新步骤指示器
            function updateSteps() {
                document.querySelectorAll('.step').forEach((step, index) => {
                    step.classList.remove('active', 'completed');
                    if (index + 1 < currentStep) {
                        step.classList.add('completed');
                    } else if (index + 1 === currentStep) {
                        step.classList.add('active');
                    }
                });
            }

            // 显示指定步骤
            function showStep(step) {
                currentStep = step;
                updateSteps();

                document.getElementById('step1Form').style.display = step === 1 ? 'block' : 'none';
                document.getElementById('step2Form').style.display = step === 2 ? 'block' : 'none';
                document.getElementById('step3Content').style.display = step === 3 ? 'block' : 'none';
                document.querySelector('.back-link').style.display = step === 3 ? 'none' : 'block';
            }

            // 步骤1: 验证身份
            document.getElementById('step1Form').addEventListener('submit', async function (e) {
                e.preventDefault();
                hideMessage();

                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();

                if (!username) {
                    showMessage('请输入用户名', 'error');
                    return;
                }

                if (!email) {
                    showMessage('请输入邮箱', 'error');
                    return;
                }

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showMessage('请输入有效的邮箱地址', 'error');
                    return;
                }

                const btn = document.getElementById('step1Btn');
                const btnText = btn.querySelector('span');
                const originalText = btnText.textContent;

                btn.disabled = true;
                btnText.innerHTML = '验证中<span class="loading"></span>';

                try {
                    // 使用API服务验证用户信息
                    const result = await window.apiService.verifyUserForReset(username, email);

                    if (result && result.success) {
                        verifiedUsername = result.username || username;
                        showMessage('身份验证成功！请设置新密码', 'success');
                        showStep(2);
                    } else {
                        showMessage('用户名与邮箱组合不匹配，请检查后重新输入', 'error');
                        btn.disabled = false;
                        btnText.textContent = originalText;
                    }
                } catch (error) {
                    console.error('验证错误:', error);
                    let errorMessage = '验证失败，请稍后重试';
                    if (error.message) {
                        errorMessage = error.message;
                    }
                    showMessage(errorMessage, 'error');
                    btn.disabled = false;
                    btnText.textContent = originalText;
                }
            });

            // 步骤2: 设置新密码
            document.getElementById('step2Form').addEventListener('submit', async function (e) {
                e.preventDefault();
                hideMessage();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!newPassword || !confirmPassword) {
                    showMessage('请填写完整的密码信息', 'error');
                    return;
                }

                if (newPassword.length < 6) {
                    showMessage('密码长度至少6位', 'error');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage('两次输入的密码不一致', 'error');
                    return;
                }

                const btn = document.getElementById('step2Btn');
                const btnText = btn.querySelector('span');
                const originalText = btnText.textContent;

                btn.disabled = true;
                btnText.innerHTML = '重置中<span class="loading"></span>';

                try {
                    // 使用API服务重置密码
                    const result = await window.apiService.resetPassword(verifiedUsername, newPassword);

                    if (result && result.success) {
                        showStep(3);
                    } else {
                        showMessage('密码重置失败，请稍后重试', 'error');
                        btn.disabled = false;
                        btnText.textContent = originalText;
                    }
                } catch (error) {
                    console.error('重置密码错误:', error);
                    let errorMessage = '重置失败，请稍后重试';
                    if (error.message) {
                        errorMessage = error.message;
                    }
                    showMessage(errorMessage, 'error');
                    btn.disabled = false;
                    btnText.textContent = originalText;
                }
            });
        </script>
        <script src="../../utils/common/touch-scroll-optimizer.js"></script>
    </body>
</html>
